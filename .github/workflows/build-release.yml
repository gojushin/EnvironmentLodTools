name: Build GUI and Release

on:
  workflow_run:
    workflows: ["Build Plugins"]
    types:
      - completed

permissions:
  contents: write

jobs:
  build-gui-windows:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          choco install mingw -y
          choco install cmake -y

      - name: Download tag info
        uses: actions/download-artifact@v4
        with:
          name: tag-info
          path: ./
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get tag name
        id: get_tag
        shell: bash
        run: |
          TAG=$(cat tag.txt)
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Detected tag: $TAG"

      - name: Download plugin artifacts from previous workflow
        uses: actions/download-artifact@v4
        with:
          name: plugins
          path: plugins/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Identify Windows plugin
        shell: bash
        run: |
          echo "=== Available plugins ==="
          ls -la plugins/
          WINDOWS_PLUGIN=$(find plugins/ -name "*windows_x64.zip" | head -1)
          if [ -z "$WINDOWS_PLUGIN" ]; then
            echo "Error: Windows plugin (*windows_x64.zip) not found!"
            ls -la plugins/
            exit 1
          else
            echo "Found Windows plugin: $WINDOWS_PLUGIN"
            echo "WINDOWS_PLUGIN_PATH=$WINDOWS_PLUGIN" >> $GITHUB_ENV
          fi

      - name: Download and Unpack embedded Python environment
        shell: bash
        run: |
          chmod +x build.sh
          ./build.sh build_env --python-version 3.11.9

      - name: Build launcher executable
        shell: bash
        run: |
          ./build.sh build_launcher

      - name: Get tag name from triggering workflow
        id: get_tag_release
        shell: bash
        run: |
          TAG=$(echo "${{ github.event.workflow_run.head_branch }}" | sed 's/refs\/tags\///')
          if [[ ! "$TAG" =~ ^v?[0-9] ]]; then
            git fetch --tags
            TAG=$(git tag --points-at ${{ github.event.workflow_run.head_sha }} | head -1)
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Detected tag: $TAG"

      - name: Package GUI with Windows plugin
        shell: bash
        run: |
          mkdir -p gui_package
          mkdir -p gui_package/plugin_src

          cp style.qss gui_package/ 2>/dev/null || echo "style.qss not found, skipping"
          cp enviro_launcher.exe gui_package/
          cp enviro_tools_gui.py gui_package/
          cp plugin_src/ds_consts.py gui_package/plugin_src
          
          cp -r python_embed gui_package/ 
          
          cp "$WINDOWS_PLUGIN_PATH" gui_package/
          echo "Included Windows plugin: $(basename $WINDOWS_PLUGIN_PATH)"
          
          cd gui_package
          7z a ../enviro_gui_${{ steps.get_tag.outputs.TAG }}_windows.zip . \
            -xr!__pycache__ \
            -xr!*.pyc
          cd ..
          
          echo "=== GUI package contents ==="
          7z l enviro_gui_${{ steps.get_tag.outputs.TAG }}_windows.zip

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-windows
          path: enviro_gui_*.zip
          retention-days: 1

  create-release:
    needs: [build-gui-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download tag info
        uses: actions/download-artifact@v4
        with:
          name: tag-info
          path: ./
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get tag name
        id: get_tag
        run: |
          TAG=$(cat tag.txt)
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Detected tag: $TAG"

      - name: Download plugin artifacts from previous workflow
        uses: actions/download-artifact@v4
        with:
          name: plugins
          path: plugins/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download GUI artifacts
        uses: actions/download-artifact@v4
        with:
          name: gui-windows
          path: gui-windows/

      - name: List downloaded files
        run: |
          echo "=== Current directory structure ==="
          find . -type f -name "*.zip" | sort

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view ${{ steps.get_tag.outputs.TAG }} --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.get_tag.outputs.TAG }} \
            --repo ${{ github.repository }} \
            --title "Release ${{ steps.get_tag.outputs.TAG }}" \
            --generate-notes \
            --prerelease

      - name: Upload individual plugin files to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find plugins -name "*.zip" -type f | while read file; do
            filename=$(basename "$file")
            echo "Uploading individual plugin: $filename"
            gh release upload ${{ steps.get_tag.outputs.TAG }} "$file" \
              --repo ${{ github.repository }} \
              --clobber
          done

      - name: Upload GUI to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find gui-windows -name "*.zip" -type f | while read file; do
            filename=$(basename "$file")
            echo "Uploading GUI package: $filename"
            gh release upload ${{ steps.get_tag.outputs.TAG }} "$file" \
              --repo ${{ github.repository }} \
              --clobber
          done
